name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: bash
        run: cmake -S plugin -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel 4
      - name: Test
        shell: bash
        run: |
          run() { f=$(find build -type f \( -name "$1" -o -name "$1.exe" \) | head -1); echo "== $f"; "$f" "${@:2}"; }
          python3 scripts/check_panel_bindings.py
          run ShogunProbe build/tabs
          if [ "$RUNNER_OS" = macOS ]; then make build/shogun_tests && ./build/shogun_tests; fi

